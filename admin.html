<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mana Village Comedy Club Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
    }
    textarea { min-height: 120px; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #185abc;
      color: white;
      margin-top: 16px;
    }
    #logoutBtn { background: #555; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Mana Village Comedy Club — Admin</h1>
  <p id="account">Not signed in</p>

  <section id="loginPanel">
    <button id="loginBtn">Sign in with Google</button>
  </section>

  <section id="editorPanel" hidden>
    <form id="settingsForm">
      <label for="title">Website Title</label>
      <input id="title" required maxlength="120">

      <label for="description">Website Description</label>
      <textarea id="description" required maxlength="1000"></textarea>

      <button id="saveBtn" type="submit">Save Changes</button>
    </form>

    <button id="logoutBtn" type="button">Logout</button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDlZJSxNA62XPgJ_5-Rjia-0E3rXBlqB0",
    authDomain: "mana-village-comedy-club-admin.firebaseapp.com",
    projectId: "mana-village-comedy-club-admin",
    storageBucket: "mana-village-comedy-club-admin.firebasestorage.app",
    messagingSenderId: "884085850855",
    appId: "1:884085850855:web:72539600123a09035ed842",
    measurementId: "G-MX2VFRBF2G"
  };

  const ADMIN_EMAIL = "sandrasrihari2002@gmail.com";
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginPanel = document.getElementById("loginPanel");
  const editorPanel = document.getElementById("editorPanel");
  const account = document.getElementById("account");
  const status = document.getElementById("status");
  const titleInput = document.getElementById("title");
  const descriptionInput = document.getElementById("description");
  const saveBtn = document.getElementById("saveBtn");

  const settingsRef = doc(db, "siteSettings", "homepage");

  document.getElementById("loginBtn").addEventListener("click", async () => {
    status.textContent = "Opening Google Sign-In...";
    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      status.textContent = "Sign-in failed: " + error.message;
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);
      status.textContent = "You have signed out.";
    } catch (error) {
      status.textContent = "Logout failed: " + error.message;
    }
  });

  async function loadSettings() {
    status.textContent = "Loading saved settings...";
    const snapshot = await getDoc(settingsRef);

    if (snapshot.exists()) {
      const data = snapshot.data();
      titleInput.value = data.title || "";
      descriptionInput.value = data.description || "";
    } else {
      titleInput.value = "Mana Village Comedy Club";
      descriptionInput.value =
        "Telugu Village Comedy, Funny Skits and Entertainment";
    }

    status.textContent = "Settings loaded.";
  }

  onAuthStateChanged(auth, async (user) => {
    loginPanel.hidden = true;
    editorPanel.hidden = true;

    if (!user) {
      account.textContent = "Not signed in";
      loginPanel.hidden = false;
      return;
    }

    if (
      user.email !== ADMIN_EMAIL ||
      user.emailVerified !== true
    ) {
      account.textContent = "Admin account not authorized.";
      status.textContent =
        "Sign in using the verified admin Google account.";
      await signOut(auth);
      return;
    }

    account.textContent = "Signed in as: " + user.email;
    editorPanel.hidden = false;

    try {
      await loadSettings();
    } catch (error) {
      status.textContent =
        "Could not load settings: " + error.message;
    }
  });

  document.getElementById("settingsForm").addEventListener(
    "submit",
    async (event) => {
      event.preventDefault();

      const user = auth.currentUser;
      if (
        !user ||
        user.email !== ADMIN_EMAIL ||
        user.emailVerified !== true
      ) {
        status.textContent = "Please sign in with the admin account.";
        return;
      }

      saveBtn.disabled = true;
      status.textContent = "Saving changes...";

      try {
        await setDoc(settingsRef, {
          title: titleInput.value.trim(),
          description: descriptionInput.value.trim(),
          updatedAt: serverTimestamp(),
          updatedBy: user.email
        }, { merge: true });

        status.textContent = "✅ Settings saved successfully!";
      } catch (error) {
        status.textContent = "Save failed: " + error.message;
      } finally {
        saveBtn.disabled = false;
      }
    }
  );
</script>
</body>
</html>
